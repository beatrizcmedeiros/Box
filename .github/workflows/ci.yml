name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prbox
          POSTGRES_PASSWORD: prbox
          POSTGRES_DB: prbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prbox -d prbox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://prbox:prbox@localhost:5432/prbox?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Migrations e seed no banco de teste
        run: |
          npm run db:deploy -w api
          npm run db:seed

      - name: Build
        run: npm run build
